dns:
  enable: true
  ipv6: false
  listen: :53
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "*.arpa"
    - "time.*.com"
    - "ntp.*.com"
    - "+.market.xiaomi.com"
    - localhost.ptlogin2.qq.com
    - "*.msftncsi.com"
    - www.msftconnecttest.com
  hosts:
    box.1248600.xyz: 38.244.11.193
  use-hosts: true
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  proxy-server-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://box.1248600.xyz:8444/dns-query
  nameserver-policy:
    "+.cn": [223.5.5.5, 119.29.29.29]
    "+.qq.com": [223.5.5.5, 119.29.29.29]
    "+.baidu.com": [223.5.5.5, 119.29.29.29]
    "+.bilibili.com": [223.5.5.5, 119.29.29.29]
    "+.jd.com": [223.5.5.5, 119.29.29.29]
  respect-rules: false
  use-system-hosts: false
  fallback: []

proxy-groups:
- name: ♻️ 自动选择
  type: url-test
  url: http://cp.cloudflare.com/generate_204
  interval: 300
  tolerance: 20
  lazy: true
  include-all-proxies: true
  filter: (?i)Lisa
- name: 🎬 Reality 专线
  type: url-test
  url: http://cp.cloudflare.com/generate_204
  interval: 300
  tolerance: 20
  lazy: true
  include-all-proxies: true
  filter: (?i)Reality
- name: 🤖 AI 服务
  type: select
  proxies:
  - 🎬 Reality 专线
  - ♻️ 自动选择
- name: 📺 流媒体
  type: select
  proxies:
  - ♻️ 自动选择
  - 🎬 Reality 专线
  - DIRECT
- name: 📱 社交媒体
  type: select
  proxies:
  - ♻️ 自动选择
  - 🎬 Reality 专线
  - DIRECT
- name: ✈️ Telegram
  type: select
  proxies:
  - ♻️ 自动选择
  - DIRECT
- name: 🍎 苹果服务
  type: select
  proxies:
  - DIRECT
  - ♻️ 自动选择
  - 🎬 Reality 专线
- name: 🎮 游戏平台
  type: select
  proxies:
  - DIRECT
  - ♻️ 自动选择
  - 🎬 Reality 专线
- name: 🛠️ 开发者
