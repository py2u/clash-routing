# ============================================================
# Proxy Groups（仅美国）
# ============================================================

proxy-groups:

  - name: "🚀 默认代理 [自选]"
    type: select
    proxies:
      - "🇺🇸 美国节点 [系统]"
      - "♻️ 自动选择 [系统]"
      - "🌐 全部节点 [系统]"
      - DIRECT

  - name: "🤖 AI服务 [自选]"
    type: select
    proxies:
      - "🇺🇸 美国节点 [系统]"
      - DIRECT

  - name: "📺 油管专用 [自选]"
    type: select
    proxies:
      - "🇺🇸 美国节点 [系统]"
      - DIRECT

  - name: "🎬 流媒体 [自选]"
    type: select
    proxies:
      - "🇺🇸 美国节点 [系统]"
      - DIRECT

  - name: "💬 电报专用 [自选]"
    type: select
    proxies:
      - "🇺🇸 美国节点 [系统]"
      - DIRECT

  - name: "Ⓜ️ 微软服务 [自选]"
    type: select
    proxies:
      - "🇺🇸 美国节点 [系统]"
      - DIRECT

  - name: "🍎 苹果服务 [自选]"
    type: select
    proxies:
      - "🇺🇸 美国节点 [系统]"
      - DIRECT

  - name: "🔍 谷歌服务 [自选]"
    type: select
    proxies:
      - "🇺🇸 美国节点 [系统]"
      - DIRECT

  - name: "💰 币圈专用 [自选]"
    type: select
    proxies:
      - "🇺🇸 美国节点 [系统]"
      - DIRECT

  - name: "🖥️ 软件分流 [自选]"
    type: select
    proxies:
      - "🚀 默认代理 [自选]"
      - "♻️ 自动选择 [系统]"
      - "🇺🇸 美国节点 [系统]"
      - DIRECT

  - name: "🌐 全部节点 [系统]"
    type: select
    include-all-proxies: true
    exclude-type: "Direct"

  - name: "♻️ 自动选择 [系统]"
    type: url-test
    include-all-proxies: true
    exclude-filter: "(?i)官网|流量|剩余|到期|过期|套餐|订阅|重置|traffic|expire|expired|subscription|reset|official|website"
    exclude-type: "Direct"
    url: "https://cp.cloudflare.com/generate_204"
    interval: 300
    tolerance: 50
    lazy: true

  - name: "🇺🇸 美国节点 [系统]"
    type: url-test
    include-all-proxies: true
    filter: '(?i)🇺🇸|美国|美|\bUS\b|\bUSA\b|United[ -]?States|America|Los[ -]?Angeles|New[ -]?York|San[ -]?Francisco'
    exclude-filter: '(?i)官网|流量|剩余|到期|过期|套餐|订阅|重置|traffic|expire|expired|subscription|reset|official|website'
    exclude-type: "Direct"
    url: "https://cp.cloudflare.com/generate_204"
    interval: 300
    tolerance: 50
    lazy: true

  - name: "🛑 广告拦截 [系统]"
    type: select
    proxies:
      - REJECT
      - DIRECT

