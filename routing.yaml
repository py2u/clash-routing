# Clash Verge / Mihomo · 仅美国 · 适中版
# 订阅 → 全局扩展覆写配置 → 粘贴保存
ipv6: false
tun:
  enable: true
  stack: mixed
  auto-route: true
  auto-detect-interface: true
  strict-route: true
  dns-hijack:
    - any:53
    - tcp://any:53
dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
  default-nameserver:
    - 223.5.5.5
    - 223.6.6.6
  proxy-server-nameserver:
    - https://doh.pub/dns-query
rule-providers:
  ads:
    type: http
    behavior: classical
    format: yaml
    interval: 86400
    url: "https://cdn.jsdelivr.net/gh/n0de-sudo/Perfect-Rules@main/Clash/rules/ads.yaml"
  ai:
    type: http
    behavior: classical
    format: yaml
    interval: 86400
    url: "https://cdn.jsdelivr.net/gh/n0de-sudo/Perfect-Rules@main/Clash/rules/ai.yaml"
  youtube:
    type: http
    behavior: classical
    format: yaml
    interval: 86400
    url: "https://cdn.jsdelivr.net/gh/n0de-sudo/Perfect-Rules@main/Clash/rules/youtube.yaml"
  disney:
    type: http
    behavior: classical
    format: yaml
    interval: 86400
    url: "https://cdn.jsdelivr.net/gh/n0de-sudo/Perfect-Rules@main/Clash/rules/disney.yaml"
  google:
    type: http
    behavior: classical
    format: yaml
    interval: 86400
    url: "https://cdn.jsdelivr.net/gh/n0de-sudo/Perfect-Rules@main/Clash/rules/google.yaml"
proxy-groups:
  - name: "🚀 默认代理"
    type: select
    proxies:
      - "🇺🇸 美国节点"
      - DIRECT
  - name: "🤖 AI服务"
    type: select
    proxies:
      - "🇺🇸 美国节点"
      - DIRECT
  - name: "📺 油管专用"
    type: select
    proxies:
      - "🇺🇸 美国节点"
      - DIRECT
  - name: "🎬 流媒体"
    type: select
    proxies:
      - "🇺🇸 美国节点"
      - DIRECT
  - name: "💬 电报专用"
    type: select
    proxies:
      - "🇺🇸 美国节点"
      - DIRECT
  - name: "🔍 谷歌服务"
    type: select
    proxies:
      - "🇺🇸 美国节点"
      - DIRECT
  - name: "🛑 广告拦截"
    type: select
    proxies:
      - REJECT
      - DIRECT
  - name: "🇺🇸 美国节点"
    type: url-test
    include-all-proxies: true
    url: "https://cp.cloudflare.com/generate_204"
    interval: 300
    tolerance: 50
    lazy: true
rules:
  - "GEOSITE,private,DIRECT"
  - "RULE-SET,ads,🛑 广告拦截"
  - "RULE-SET,ai,🤖 AI服务"
  - "RULE-SET,youtube,📺 油管专用"
  - "RULE-SET,disney,🎬 流媒体"
  - "GEOSITE,netflix,🎬 流媒体"
  - "RULE-SET,google,🔍 谷歌服务"
  - "GEOSITE,telegram,💬 电报专用"
  - "DOMAIN-SUFFIX,net.coffee,🚀 默认代理"
  - "GEOSITE,cn,DIRECT"
  - "GEOIP,CN,DIRECT,no-resolve"
  - "MATCH,🚀 默认代理"
