# Clash Verge Rev / Mihomo 覆写配置（按用途分类版）
# 导入「扩展覆写配置 / Merge」，不要替换订阅本身。
# 3 组：🤖 AI 专用｜🎬 流媒体｜🌍 海外

mode: rule
ipv6: false
unified-delay: true
tcp-concurrent: true
profile:
  store-selected: true
  store-fake-ip: true

# ------------------------------------------------------------
# DNS
# ------------------------------------------------------------
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "+.lan"
    - "+.local"
    - "+.arpa"
    - "+.in-addr.arpa"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "localhost"
    - "+.localdomain"
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  nameserver-policy:
    "rule-set:cn-domain":
      - https://dns.alidns.com/dns-query
      - https://doh.pub/dns-query
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  respect-rules: true

# ------------------------------------------------------------
# 域名嗅探
# ------------------------------------------------------------
sniffer:
  enable: true
  sniff:
    TLS:
      ports: [443, 8443]
    HTTP:
      ports: [80, 8080-8880]
  skip-domain:
    - "+.push.taobao.com"
    - "+.push.aliyuncs.com"

# ------------------------------------------------------------
# 策略组（按用途分类，共 3 个；不按地区/节点名筛选）
# ------------------------------------------------------------
proxy-groups:
  # 用途组 1：AI 专用
  # select 类型 + 手动选一个节点 = 出口固定，不会像 url-test 那样自动跳。
  # 首次使用请在此组里手动选一个节点，之后不要改。
  - name: "🤖 AI 专用"
    type: select
    include-all: true

  # 用途组 2：流媒体
  # 以 YouTube 为探活目标，自动挑延迟最低的节点（url-test）。
  - name: "🎬 YouTube"
    type: url-test
    include-all: true
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/YouTube.png
    url: https://www.youtube.com/generate_204
    expected-status: "200/204/302"
    interval: 300
    tolerance: 50
    lazy: true

  # 用途组 3：海外
  # 列出全部节点，另附 DIRECT；未知流量走本组，可手动挑节点。
  - name: "🌍 海外"
    type: select
    include-all: true
    proxies:
      - DIRECT

# ------------------------------------------------------------
# 规则集订阅
# ------------------------------------------------------------
rule-providers:
  private-domain:
    type: http
    behavior: domain
    format: mrs
    interval: 86400
    path: ./ruleset/private-domain.mrs
    proxy: "🎬 流媒体"
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/private.mrs

  ads-domain:
    type: http
    behavior: domain
    format: mrs
    interval: 86400
    path: ./ruleset/ads-domain.mrs
    proxy: "🎬 流媒体"
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/category-ads-all.mrs

  cn-domain:
    type: http
    behavior: domain
    format: mrs
    interval: 86400
    path: ./ruleset/cn-domain.mrs
    proxy: "🎬 流媒体"
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/cn.mrs

  overseas-domain:
    type: http
    behavior: domain
    format: mrs
    interval: 86400
    path: ./ruleset/overseas-domain.mrs
    proxy: "🎬 流媒体"
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/geolocation-!cn.mrs

  apple-cn:
    type: http
    behavior: domain
    format: mrs
    interval: 86400
    path: ./ruleset/apple-cn.mrs
    proxy: "🎬 流媒体"
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/apple-cn.mrs

  microsoft-cn:
    type: http
    behavior: domain
    format: mrs
    interval: 86400
    path: ./ruleset/microsoft-cn.mrs
    proxy: "🎬 流媒体"
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/microsoft%40cn.mrs

  steam-cn:
    type: http
    behavior: domain
    format: mrs
    interval: 86400
    path: ./ruleset/steam-cn.mrs
    proxy: "🎬 流媒体"
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/steam%40cn.mrs

  cn-ip:
    type: http
    behavior: ipcidr
    format: mrs
    interval: 86400
    path: ./ruleset/cn-ip.mrs
    proxy: "🎬 流媒体"
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/cn.mrs

# ------------------------------------------------------------
# 分流规则（自上而下，首条命中生效）
# ------------------------------------------------------------
rules:
  # 局域网、本机、NAS、打印机等
  - GEOIP,private,DIRECT,no-resolve
  - RULE-SET,private-domain,DIRECT

  # 广告拦截
  - RULE-SET,ads-domain,REJECT

  # 中国区服务保持直连
  - RULE-SET,apple-cn,DIRECT
  - RULE-SET,microsoft-cn,DIRECT
  - RULE-SET,steam-cn,DIRECT

  # ---------- 用途 1：AI 专用（固定出口，必须放在 overseas-domain 之前） ----------
  - DOMAIN-SUFFIX,anthropic.com,🤖 AI 专用
  - DOMAIN-SUFFIX,claude.ai,🤖 AI 专用
  - DOMAIN-SUFFIX,claude.com,🤖 AI 专用
  - DOMAIN-SUFFIX,clau.de,🤖 AI 专用
  - DOMAIN-SUFFIX,claudeusercontent.com,🤖 AI 专用
  - DOMAIN-SUFFIX,claudemcpcontent.com,🤖 AI 专用
  - DOMAIN-SUFFIX,claudemcpclient.com,🤖 AI 专用
  - DOMAIN-SUFFIX,claude.app,🤖 AI 专用
  - DOMAIN-SUFFIX,claude.new,🤖 AI 专用
  - DOMAIN-SUFFIX,claude.site,🤖 AI 专用
  - DOMAIN-SUFFIX,claudepages.dev,🤖 AI 专用
  - DOMAIN-SUFFIX,ant.dev,🤖 AI 专用
  - DOMAIN-SUFFIX,antspace.dev,🤖 AI 专用
  - DOMAIN,anthropic.auth0.com,🤖 AI 专用
  - DOMAIN-SUFFIX,hcaptcha.com,🤖 AI 专用
  - DOMAIN-SUFFIX,arkoselabs.com,🤖 AI 专用
  - DOMAIN-SUFFIX,openai.com,🤖 AI 专用
  - DOMAIN-SUFFIX,chatgpt.com,🤖 AI 专用
  - DOMAIN-SUFFIX,oaiusercontent.com,🤖 AI 专用
  - DOMAIN-SUFFIX,oaistatic.com,🤖 AI 专用

  # ---------- 用途 2：流媒体（自动测速，必须放在 overseas-domain 之前） ----------
  - DOMAIN-SUFFIX,netflix.com,🎬 流媒体
  - DOMAIN-SUFFIX,nflxvideo.net,🎬 流媒体
  - DOMAIN-SUFFIX,nflximg.net,🎬 流媒体
  - DOMAIN-SUFFIX,youtube.com,🎬 流媒体
  - DOMAIN-SUFFIX,googlevideo.com,🎬 流媒体
  - DOMAIN-SUFFIX,ytimg.com,🎬 流媒体
  - DOMAIN-SUFFIX,spotify.com,🎬 流媒体
  - DOMAIN-SUFFIX,spotifycdn.com,🎬 流媒体
  - DOMAIN-SUFFIX,scdn.co,🎬 流媒体
  - DOMAIN-SUFFIX,disneyplus.com,🎬 流媒体
  - DOMAIN-SUFFIX,disney-plus.net,🎬 流媒体
  - DOMAIN-SUFFIX,primevideo.com,🎬 流媒体
  - DOMAIN-SUFFIX,hulu.com,🎬 流媒体
  - DOMAIN-SUFFIX,twitch.tv,🎬 流媒体
  - DOMAIN-SUFFIX,twitchcdn.net,🎬 流媒体
  - DOMAIN-SUFFIX,hbomax.com,🎬 流媒体

  # 海外服务优先代理，避免被国内 CDN IP 误判为直连
  - RULE-SET,overseas-domain,🌍 通用海外

  # 国内网站与国内 IP 直连
  - RULE-SET,cn-domain,DIRECT
  - RULE-SET,cn-ip,DIRECT

  # 未知目的地走通用海外组
  - MATCH,🌍 通用海外
