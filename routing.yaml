proxy-groups:
  - name: 🚀 节点选择
    type: select
    proxies:
      - ♻️ 自动选择
      - 🇺🇸 美国节点
      - DIRECT

  - name: ♻️ 自动选择
    type: url-test
    include-all: true
    filter: "^(?!.*(?:剩余|流量|到期|官网|套餐)).*$"
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    lazy: true

  - name: 🇺🇸 美国节点
    type: select
    include-all: true
    filter: "(?i)(🇺🇸|美国|us|united.?states|america)"
