proxy-groups:
- name: ♻️ 自动选择
  type: url-test
  url: http://cp.cloudflare.com/generate_204
  interval: 300
  tolerance: 20
  lazy: true
  include-all-proxies: true
  filter: (?i)Lisa
- name: 🎬 Reality 专线
  type: url-test
  url: http://cp.cloudflare.com/generate_204
  interval: 300
  tolerance: 20
  lazy: true
  include-all-proxies: true
  filter: (?i)Reality
- name: 🤖 AI 服务
  type: select
  proxies:
  - 🎬 Reality 专线
  - ♻️ 自动选择
  - DIRECT
  url: http://cp.cloudflare.com/generate_204
  interval: 300
- name: 📺 流媒体
  type: select
  proxies:
  - ♻️ 自动选择
  - 🎬 Reality 专线
  - DIRECT
  url: http://cp.cloudflare.com/generate_204
  interval: 300
- name: ✈️ Telegram
  type: select
  proxies:
  - ♻️ 自动选择
  - DIRECT
  url: http://cp.cloudflare.com/generate_204
  interval: 300
