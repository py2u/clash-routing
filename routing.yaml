# ============================================================
# 阿尔忒弥斯实验室 · Clash 完美分流 3.0 · 仅美国版
#
# 面向 Clash Verge / Mihomo
# 使用：Clash Verge → 订阅 → 全局扩展覆写配置
# 将本文件完整粘贴后保存即可。
#
# 已移除：香港 / 日本 / 新加坡 / 台湾 / 其他地区
# ============================================================

ipv6: false

# ============================================================
# TUN
# ============================================================

tun:
  enable: true
  stack: mixed
  auto-route: true
  auto-detect-interface: true
  strict-route: true
  dns-hijack:
    - any:53
    - tcp://any:53

# ============================================================
# DNS
# ============================================================

dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - '*.lan'
  nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
  default-nameserver:
    - 223.5.5.5
    - 223.6.6.6
  proxy-server-nameserver:
    - https://doh.pub/dns-query

# ============================================================
# Rule Providers
# ============================================================

rule-providers:

  ads:
    type: http
