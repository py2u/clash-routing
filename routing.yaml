proxy-groups:
  - name: 🚀 节点选择
    type: select
    proxies:
      - ♻️ 自动选择
      - 🇺🇸 美国节点
      - DIRECT

  - name: ♻️ 自动选择
    type: url-test
    include-all: true
    filter: "^(?!.*(?:剩余|流量|到期|官网|套餐)).*$"
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    lazy: true

  - name: 🇺🇸 美国节点
    type: select
    include-all: true
    filter: "(?i)(🇺🇸|美国|us|united.?states|america)"

  # 国内服务默认直连；出现问题时可手动切到美国节点
  - name: 🇨🇳 国内服务
    type: select
    proxies:
      - DIRECT
      - 🚀 节点选择
      - 🇺🇸 美国节点

  # 所有海外服务默认走美国节点
  - name: 🌍 海外服务
    type: select
    proxies:
      - 🇺🇸 美国节点
      - ♻️ 自动选择
      - 🚀 节点选择

  - name: 🤖 OpenAI
    type: select
    proxies: [🇺🇸 美国节点, ♻️ 自动选择, 🚀 节点选择]

  - name: 🔍 Google
    type: select
    proxies: [🇺🇸 美国节点, ♻️ 自动选择, 🚀 节点选择]

  - name: ▶️ YouTube
    type: select
    proxies: [🇺🇸 美国节点, ♻️ 自动选择, 🚀 节点选择]

  - name: 🐙 GitHub
    type: select
    proxies: [🇺🇸 美国节点, ♻️ 自动选择, 🚀 节点选择]

  - name: 🎬 Netflix
    type: select
    proxies: [🇺🇸 美国节点, ♻️ 自动选择, 🚀 节点选择]

  - name: ✈️ Telegram
    type: select
    proxies: [🇺🇸 美国节点, ♻️ 自动选择, 🚀 节点选择]

  - name: 🎵 Spotify
    type: select
    proxies: [🇺🇸 美国节点, ♻️ 自动选择, 🚀 节点选择]

  # 中国区 Apple / Microsoft 默认直连，国际服务可手动改为美国节点
  - name: 🍎 Apple
    type: select
    proxies: [🇨🇳 国内服务, DIRECT, 🇺🇸 美国节点]

  - name: Ⓜ️ Microsoft
    type: select
    proxies: [🇨🇳 国内服务, DIRECT, 🇺🇸 美国节点]

  - name: 🎮 Steam
    type: select
    proxies: [DIRECT, 🇺🇸 美国节点, 🚀 节点选择]

  - name: 🛑 广告拦截
    type: select
    proxies: [REJECT, DIRECT]

  - name: 🐟 漏网之鱼
    type: select
    proxies: [🌍 海外服务, 🇺🇸 美国节点, DIRECT]
