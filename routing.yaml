# ============================================================
# Clash Verge Rev / Mihomo 全局扩展覆写配置
# 路径：订阅 → 全局扩展覆写配置 → 粘贴保存 → 重新点击当前订阅
# ============================================================

# ------------------------------------------------------------
# 1. 基础运行参数
# ------------------------------------------------------------
mode: rule
ipv6: false
log-level: warning
unified-delay: true
tcp-concurrent: true
keep-alive-interval: 30
find-process-mode: strict
global-client-fingerprint: chrome

geodata-mode: true
geo-auto-update: true
geo-update-interval: 24

profile:
  store-selected: true
  store-fake-ip: true

# ------------------------------------------------------------
# 2. TUN 虚拟网卡
# ------------------------------------------------------------
tun:
  enable: true
  stack: mixed
  auto-route: true
  auto-detect-interface: true
  strict-route: true
  endpoint-independent-nat: true
  dns-hijack:
    - any:53
    - tcp://any:53

# ------------------------------------------------------------
# 3. DNS 解析
# ------------------------------------------------------------
dns:
  enable: true
  listen: 127.0.0.1:1053
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  cache-algorithm: arc
  respect-rules: true
  use-hosts: false
  use-system-hosts: false
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  proxy-server-nameserver:
    - https://223.5.5.5/dns-query
    - https://1.12.12.12/dns-query
  direct-nameserver:
    - https://223.5.5.5/dns-query
    - https://1.12.12.12/dns-query
  nameserver:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query
  nameserver-policy:
    "geosite:cn,private":
      - https://223.5.5.5/dns-query
      - https://1.12.12.12/dns-query
  fake-ip-filter:
    - "geosite:private"
    - "geosite:connectivity-check"
    - "geosite:cn"
    - "*.lan"
    - "*.local"
    - "time.*.com"
    - "time.*.apple.com"
    - "ntp.*.com"
    - "*.ntp.org.cn"
    - "localhost.ptlogin2.qq.com"
    - "localhost.sec.qq.com"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"

# ------------------------------------------------------------
# 4. 流量嗅探
# ------------------------------------------------------------
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: false
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
      override-destination: true
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "Mijia Cloud"
    - "+.push.apple.com"
    - "+.lan"
    - "+.local"

# ------------------------------------------------------------
# 5. 策略组
# ------------------------------------------------------------
proxy-groups:
  - name: "🚀 默认代理"
    type: select
    include-all-proxies: true
    proxies:
      - "🇺🇸 美国最快"
      - DIRECT

  - name: "🤖 AI服务"
    type: select
    include-all-proxies: true
    proxies:
      - "🛡️ AI固定"
      - "🇺🇸 美国最快"
      - DIRECT

  # 油管 / 流媒体 / 电报：直接包含全部 5 个节点，自动测速选最快
  - name: "📺 油管专用"
    type: url-test
    include-all-proxies: true
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 30
    lazy: true

  - name: "🎬 流媒体"
    type: url-test
    include-all-proxies: true
    url: https://cp.cloudflare.com/generate_204
    interval: 300
    tolerance: 30
    lazy: true

  - name: "💬 电报专用"
    type: url-test
    include-all-proxies: true
    url: https://cp.cloudflare.com/generate_204
    interval: 300
    tolerance: 30
    lazy: true

  - name: "🛑 广告拦截"
    type: select
    proxies:
      - REJECT-DROP
      - REJECT
      - DIRECT

  - name: "🛡️ AI固定"
    type: fallback
    include-all-proxies: true
    filter: '(?i)reality|vision'
    url: https://cp.cloudflare.com/generate_204
    interval: 300
    lazy: true

  - name: "🇺🇸 美国最快"
    type: url-test
    include-all-proxies: true
    url: https://cp.cloudflare.com/generate_204
    interval: 300
    tolerance: 30
    lazy: true

# ------------------------------------------------------------
# 6. 规则集
# ------------------------------------------------------------
rule-providers:
  ads:
    type: http
    behavior: classical
    format: yaml
    interval: 86400
    proxy: "🚀 默认代理"
    path: ./ruleset/ads.yaml
    url: "https://cdn.jsdelivr.net/gh/n0de-sudo/Perfect-Rules@main/Clash/rules/ads.yaml"

  ai:
    type: http
    behavior: classical
    format: yaml
    interval: 86400
    proxy: "🚀 默认代理"
    path: ./ruleset/ai.yaml
    url: "https://cdn.jsdelivr.net/gh/n0de-sudo/Perfect-Rules@main/Clash/rules/ai.yaml"

  youtube:
    type: http
    behavior: classical
    format: yaml
    interval: 86400
    proxy: "🚀 默认代理"
    path: ./ruleset/youtube.yaml
    url: "https://cdn.jsdelivr.net/gh/n0de-sudo/Perfect-Rules@main/Clash/rules/youtube.yaml"

  disney:
    type: http
    behavior: classical
    format: yaml
    interval: 86400
    proxy: "🚀 默认代理"
    path: ./ruleset/disney.yaml
    url: "https://cdn.jsdelivr.net/gh/n0de-sudo/Perfect-Rules@main/Clash/rules/disney.yaml"

# ------------------------------------------------------------
# 7. 分流规则
# ------------------------------------------------------------
rules:
  - GEOSITE,private,DIRECT
  - GEOIP,private,DIRECT,no-resolve
  - RULE-SET,ads,🛑 广告拦截
  - AND,((NETWORK,UDP),(DST-PORT,443),(RULE-SET,youtube)),REJECT-DROP
  - RULE-SET,ai,🤖 AI服务
  - RULE-SET,youtube,📺 油管专用
  - RULE-SET,disney,🎬 流媒体
  - GEOSITE,netflix,🎬 流媒体
  - GEOSITE,telegram,💬 电报专用
  - GEOIP,telegram,💬 电报专用,no-resolve
  - DOMAIN-SUFFIX,net.coffee,🚀 默认代理
  - GEOSITE,geolocation-!cn,🚀 默认代理
  - GEOSITE,cn,DIRECT
  - GEOIP,cn,DIRECT
  - MATCH,🚀 默认代理
